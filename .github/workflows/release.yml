name: Release

# Release flow (release-please):
#   1. Every push to main updates a release PR that bumps package.json, writes
#      CHANGELOG.md and (via refresh-release-pr) rebuilds dist/.
#   2. Merging that PR tags the merge commit and publishes it to npm with
#      provenance. The tagged commit therefore already carries the published
#      version and dist/, which n8n Creator Portal vetting requires.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false  # Never cancel — let a running release finish

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr: ${{ steps.rp.outputs.pr }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # GITHUB_TOKEN so release-please's API commits are signed by GitHub,
          # as required by the org's required_signatures ruleset.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  refresh-release-pr:
    name: Rebuild dist on release PR
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.pr && needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: write
      actions: write # gh workflow run ci.yml on the release branch
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: Commit dist changes (signed, via API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist/ is up to date"
            exit 0
          fi
          # createCommitOnBranch commits are signed by GitHub, unlike a git push
          # from the runner, so they pass the required_signatures ruleset.
          additions='[]'
          deletions='[]'
          while IFS=$'\t' read -r status path; do
            if [ "$status" = "D" ]; then
              deletions=$(jq -c --arg p "$path" '. + [{path: $p}]' <<<"$deletions")
            else
              additions=$(jq -c --arg p "$path" --rawfile c <(base64 -w0 "$path") '. + [{path: $p, contents: $c}]' <<<"$additions")
            fi
          done < <(git diff --cached --name-status --no-renames)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --argjson additions "$additions" \
            --argjson deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                message: { headline: "chore: rebuild dist" },
                expectedHeadOid: $head,
                fileChanges: { additions: $additions, deletions: $deletions }
              } }
            }' > /tmp/commit.json
          gh api graphql --input /tmp/commit.json --jq '.data.createCommitOnBranch.commit.oid'

      - name: Trigger CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PRs and commits created with GITHUB_TOKEN don't trigger `pull_request`
          # CI, so the required status check would never appear. Dispatch it.
          gh workflow run ci.yml --ref "$BRANCH"

  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write # for npm provenance

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package.json matches the release
        run: |
          actual=$(node -p 'require("./package.json").version')
          if [ "$actual" != "${{ needs.release-please.outputs.version }}" ]; then
            echo "::error::package.json is $actual, release is ${{ needs.release-please.outputs.version }}"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        # Trusted Publishing via OIDC — no NPM_TOKEN needed (id-token: write grants OIDC access).
        # The trusted publisher is bound to this workflow file name (release.yml).
        # --provenance required by n8n from 2026-05-01
        # Note: @n8n/scan-community-package intentionally removed from this workflow — repeated
        # invocation issues documented in PRs #47–#51.
        run: pnpm publish --no-git-checks --access public --provenance
