name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false  # Never cancel — let a running release finish

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}  # Always use tip of default branch to avoid "local branch behind remote" error

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      id-token: write # for npm provenance

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: pnpm version ${{ needs.semantic-release.outputs.new_release_version }} --no-git-tag-version

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        # Trusted Publishing via OIDC — no NPM_TOKEN needed (id-token: write grants OIDC access)
        # --provenance required by n8n from 2026-05-01
        # Note: @n8n/scan-community-package intentionally removed from this workflow — repeated
        # invocation issues documented in PRs #47–#51.
        run: pnpm publish --no-git-checks --access public --provenance

  sync-version:
    name: Sync package.json version + dist
    runs-on: ubuntu-latest
    needs: [semantic-release, publish]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the release tag so dist/ is built from the exact released code
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version in package.json
        run: pnpm version ${{ needs.semantic-release.outputs.new_release_version }} --no-git-tag-version

      - name: Build dist
        run: pnpm build

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # Must be GITHUB_TOKEN for sign-commits to produce verified signatures —
          # GitHub only auto-signs commits made via the API by the calling installation
          # token (the GHA bot identity). Commits made via a user PAT come out
          # unsigned and are rejected by the org's required_signatures ruleset.
          # Trade-off: the sync PR's CI won't auto-trigger; close-reopening also
          # won't help (same github-actions[bot] actor restriction). To run CI,
          # push an empty commit (`git commit --allow-empty`) or dispatch via
          # `gh workflow run ci.yml --ref chore/release-v<version>`.
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          base: main
          branch: chore/release-v${{ needs.semantic-release.outputs.new_release_version }}
          commit-message: "chore: sync package.json and dist to v${{ needs.semantic-release.outputs.new_release_version }}"
          title: "chore: sync package.json and dist to v${{ needs.semantic-release.outputs.new_release_version }}"
          body: |
            Automated sync after npm release v${{ needs.semantic-release.outputs.new_release_version }}.

            - Updates `package.json` version to match the published npm version
            - Rebuilds `dist/` from the release tag so the repo stays current

            Required for n8n submission vetting (checks both repo version and credential file).
          labels: automated

      - name: Trigger CI and enable auto-merge on the sync PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/release-v${{ needs.semantic-release.outputs.new_release_version }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # Bot-created PRs don't auto-trigger `pull_request` CI (GitHub actor
          # restriction — see the sign-commits note above), so the required status
          # check never appears and the PR sits forever. Dispatch CI explicitly on
          # the sync branch to produce the check, then enable auto-merge so GitHub
          # lands it once green. This keeps package.json + dist on main in sync with
          # the published npm version on every release (required for n8n vetting).
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$PR" --squash --auto
